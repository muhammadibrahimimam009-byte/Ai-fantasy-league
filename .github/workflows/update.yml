name: Update AI Fantasy League

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Get official FPL results
        run: python scripts/update_fpl.py

      - name: Save updated results
        run: |
          git config user.name "AI Fantasy League Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/results.json

          git diff --cached --quiet || git commit -m "Update official FPL results"

          git push
