name: Update AI Fantasy League

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get official FPL results
        run: |
          python scripts/update_fpl.py

      - name: Save updated results
        run: |
          git config user.name "AI Fantasy League Bot"
          git config user.email "actions@github.com"

          git add data/results.json

          if git diff --cached --quiet; then
            echo "No changes to results.json"
          else
            git commit -m "Update official FPL results"
            git push
          fi
