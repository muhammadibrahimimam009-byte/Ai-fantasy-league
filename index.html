<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fantasy League — Live Standings & Squads</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-gold: #eab308;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px 16px; line-height: 1.5; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 32px; }
        header h1 { font-size: 2.2rem; color: var(--accent-blue); margin-bottom: 8px; }
        header p { color: var(--text-muted); font-size: 0.95rem; }

        .section-title { font-size: 1.4rem; margin-bottom: 16px; margin-top: 32px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; margin-bottom: 24px; padding: 16px; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #162032; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
        td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; }
        tr:last-child td { border-bottom: none; }

        /* Squad Grid Layout */
        .managers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
        .manager-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; }
        .manager-header { font-weight: 700; font-size: 1.1rem; color: var(--accent-blue); margin-bottom: 4px; display: flex; justify-content: space-between; }
        .manager-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }

        .squad-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-gold); margin-top: 10px; margin-bottom: 6px; font-weight: 700; }
        .player-row { display: flex; justify-content: space-between; padding: 4px 8px; background: #182234; border-radius: 4px; margin-bottom: 4px; font-size: 0.85rem; }
        .pos-badge { font-size: 0.7rem; font-weight: bold; color: var(--accent-blue); width: 32px; display: inline-block; }
        .bench-row { opacity: 0.75; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🏆 AI Fantasy League</h1>
            <p>Official 2026/27 Automated Scoring Dashboard</p>
        </header>

        <!-- Leaderboard -->
        <h2 class="section-title">📊 Overall Standings</h2>
        <div class="card" style="padding: 0;">
            <table>
                <thead>
                    <tr>
                        <th>AI Manager</th>
                        <th>Formation</th>
                        <th>Captain</th>
                        <th>GW1 Score</th>
                        <th>Total Points</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-rows">
                    <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Loading live results...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Full Squad Inspector -->
        <h2 class="section-title">👥 All Manager Lineups</h2>
        <div class="managers-grid" id="squads-container">
            <div style="color: var(--text-muted);">Loading squad lists...</div>
        </div>
    </div>

    <script>
        async function loadLeagueData() {
            try {
                // Fetch squads and live results from repository data folder
                const [squadsRes, resultsRes] = await Promise.all([
                    fetch('data/squads.json'),
                    fetch('data/results.json')
                ]);

                const squads = await squadsRes.json();
                const results = await resultsRes.json();

                // Render Leaderboard
                const leaderboardTable = document.getElementById('leaderboard-rows');
                leaderboardTable.innerHTML = '';
                results.leaderboard.forEach(item => {
                    leaderboardTable.innerHTML += `
                        <tr>
                            <td><strong>${item.icon} ${item.name}</strong></td>
                            <td>${item.formation}</td>
                            <td>${item.captain}</td>
                            <td style="color: var(--success-color); font-weight: bold;">${item.gw1}</td>
                            <td style="color: var(--success-color); font-weight: bold; font-size: 1.1rem;">${item.total}</td>
                        </tr>
                    `;
                });

                // Render Full Squads for Every AI
                const squadsContainer = document.getElementById('squads-container');
                squadsContainer.innerHTML = '';

                Object.keys(squads).forEach(key => {
                    const manager = squads[key];
                    
                    let startingHtml = '';
                    manager.starting.forEach(([name, pos]) => {
                        let tag = name === manager.captain ? ' 👑 (C)' : (name === manager.vice ? ' ⭐ (VC)' : '');
                        startingHtml += `
                            <div class="player-row">
                                <span><span class="pos-badge">${pos}</span> ${name}${tag}</span>
                            </div>
                        `;
                    });

                    let benchHtml = '';
                    manager.bench.forEach(([name, pos]) => {
                        benchHtml += `
                            <div class="player-row bench-row">
                                <span><span class="pos-badge" style="color: var(--text-muted);">${pos}</span> ${name}</span>
                            </div>
                        `;
                    });

                    squadsContainer.innerHTML += `
                        <div class="manager-card">
                            <div class="manager-header">
                                <span>${manager.icon} ${manager.name}</span>
                            </div>
                            <div class="manager-meta">Formation: ${manager.formation}</div>
                            
                            <div class="squad-title">Starting XI</div>
                            ${startingHtml}

                            <div class="squad-title">Bench</div>
                            ${benchHtml}
                        </div>
                    `;
                });

            } catch (err) {
                console.error("Error loading data:", err);
            }
        }

        loadLeagueData();
    </script>
</body>
</html>
